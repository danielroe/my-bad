<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Widgets</title>
  <style>
    html { color-scheme: light dark; font: 15px/1.5 system-ui, sans-serif; background: light-dark(#fafafa, #18181b); color: light-dark(#18181b, #f4f4f5) }
    body { margin: 0; padding: 56px 72px }
    h1 { margin: 0 0 32px; font-size: 28px }
    ul { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; padding: 0; margin: 0; list-style: none }
    li { height: 140px; border-radius: 12px; background: light-dark(#fff, #27272a); box-shadow: 0 1px 2px rgb(0 0 0 / 0.08) }
  </style>
</head>
<body>
  <h1>Widgets</h1>
  <ul>
    <li></li><li></li><li></li><li></li><li></li><li></li>
  </ul>
</body>
</html>
